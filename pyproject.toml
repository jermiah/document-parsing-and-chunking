[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "document-ingestion"
version = "0.1.0"
description = "PDF parsing, image annotations and document chunking"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3", "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pymupdf>=1.26,<2",
  "pillow>=11,<13", "numpy>=2,<3", "pyyaml>=6,<7", "beautifulsoup4>=4.13,<5",
  "llama-index-core>=0.14,<0.15", "tokenizers>=0.22,<1",
]

[project.optional-dependencies]
docling = ["docling==2.125.0", "docling-core==2.94.1", "rapidocr==3.9.2", "onnxruntime>=1.22,<2", "torch>=2.10,<3", "torchvision>=0.25,<1"]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "types-PyYAML"]

[project.scripts]
doc-ingest = "ingestion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["postgres: requires PostgreSQL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
files = ["src"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

torchvision = { index = "pytorch-cpu" }

